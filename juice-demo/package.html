<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>juice 1.0.0 package-only</title>
  <link rel="stylesheet" href="../juice/1.0.0/juice.css">
  <link rel="stylesheet" href="../juice/1.0.0/juice-menu.css">
  <style>
    body{margin:0;background:#0A0A0A;color:#F4E8D5;font:400 16px/1.4 system-ui,sans-serif}
    header{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-height:56px;padding:8px 16px}
    .hud__right{display:flex;align-items:center;gap:8px}
    main{max-width:520px;margin:0 auto;padding:24px 16px}
    .jz-host{padding:20px;background:#161616;border-radius:12px}
    h1{font:700 22px/1.2 system-ui,sans-serif}
    p{color:#B7B3AD}
    button{min-height:44px;padding:0 16px;border:0;border-radius:6px;background:#FF6B35;color:#0A0A0A;font:700 16px system-ui,sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <header>
    <div class="hud__right">
      <button type="button" class="juice-sfx" aria-pressed="false">🔇</button>
    </div>
  </header>
  <main>
    <article class="jz-host">
      <h1>Título de la card</h1>
      <p>Descripción que el sello no debe tapar. Solo archivos de /juice/1.0.0/.</p>
      <ol class="jz-steps">
        <li><span class="jz-check">✓</span><span>Paso</span></li>
      </ol>
      <button type="button" class="btn btn--primary" data-jz="jz-success">Marcar listo</button>
    </article>
  </main>
  <script src="../juice/1.0.0/juice.js" defer></script>
  <script src="../juice/1.0.0/juice-menu.js" defer></script>
</body>
</html>
